name: PR-Stand im Profil

# Übernimmt täglich die PR-Zahlen aus pr-stand.json des Web-CVs (dieselbe Quelle wie der Lebenslauf)
# und committet das README nur bei Änderung. Kein Token außer GITHUB_TOKEN.

on:
  schedule:
    - cron: '30 6 * * *'        # täglich 06:30 UTC, nach Zähler (05:40) und Stand-Workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stand:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Selbsttest
        run: python3 .github/test_profil_stand.py
      - name: Stand vom Web-CV holen
        run: curl -fsSL --retry 3 -o /tmp/pr-stand.json https://jasonroschmann.github.io/cv/pr-stand.json
      - run: python3 .github/profil_stand.py /tmp/pr-stand.json
      - name: Commit nur bei Änderung
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "README unverändert"; exit 0; fi
          git commit -q -m "chore: PR-Stand im Profil [skip ci]"
          git pull --rebase -q && git push
